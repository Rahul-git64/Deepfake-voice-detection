<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VOXFORENSICS // Neural Voice Deepfake & Scam Detector</title>

  <!-- Google Fonts: Space Grotesk, Inter, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />

  <!-- Core Runtime Libraries -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.0/babel.min.js"></script>
  <script src="https://unpkg.com/wavesurfer.js@7.8.15/dist/wavesurfer.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <style>
    :root {
      --bg-base: #07080d;
      --bg-elevated: #0c0e17;
      --glass-bg: rgba(255, 255, 255, 0.04);
      --glass-bg-hover: rgba(255, 255, 255, 0.065);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-border-bright: rgba(255, 255, 255, 0.16);
      --text-primary: #e8ecf4;
      --text-muted: #8b93a7;
      --text-dim: #525b70;

      /* Forensic State Accents */
      --cyan: #22d3ee;
      --cyan-glow: rgba(34, 211, 238, 0.25);
      --green: #34d399;
      --green-glow: rgba(52, 211, 153, 0.25);
      --magenta: #ff2e88;
      --magenta-glow: rgba(255, 46, 136, 0.28);
      --red: #ff4d4d;
      --red-glow: rgba(255, 77, 77, 0.3);
      --amber: #fbbf24;
      --amber-glow: rgba(251, 191, 36, 0.25);

      --font-heading: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    html {
      scroll-behavior: smooth;
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: var(--font-body);
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      line-height: 1.5;
    }

    /* Animated Cyber Forensics Grid + Noise Overlay */
    .cyber-grid {
      position: fixed;
      inset: 0;
      background-size: 48px 48px;
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.022) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.022) 1px, transparent 1px);
      mask-image: radial-gradient(ellipse 80% 70% at 50% 30%, #000 40%, transparent 100%);
      -webkit-mask-image: radial-gradient(ellipse 80% 70% at 50% 30%, #000 40%, transparent 100%);
      pointer-events: none;
      z-index: 0;
      animation: gridDrift 24s linear infinite;
    }

    @keyframes gridDrift {
      0% { transform: translateY(0px); }
      100% { transform: translateY(48px); }
    }

    .noise-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      opacity: 0.032;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    .ambient-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      transition: background 0.9s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Typography helpers */
    h1, h2, h3, h4, .font-heading { font-family: var(--font-heading); }
    .mono { font-family: var(--font-mono); }

    .container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 0 24px;
      position: relative;
      z-index: 10;
    }

    /* Sticky Translucent Navbar */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      height: 72px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      background: rgba(7, 8, 13, 0.78);
      border-bottom: 1px solid var(--glass-border);
      transition: border-color 0.3s ease;
    }

    .nav-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 100%;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text-primary);
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, rgba(34, 211, 238, 0.18), rgba(255, 46, 136, 0.18));
      border: 1px solid rgba(34, 211, 238, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(34, 211, 238, 0.2);
      position: relative;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .nav-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: color 0.2s ease;
    }
    .nav-link:hover { color: var(--text-primary); }

    .health-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 6px 14px;
      border-radius: 9999px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      font-size: 12px;
      color: var(--text-primary);
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      position: relative;
    }
    .pulse-dot.online {
      background: var(--green);
      box-shadow: 0 0 10px var(--green);
    }
    .pulse-dot.online::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 1px solid var(--green);
      animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite;
    }
    .pulse-dot.offline {
      background: var(--red);
      box-shadow: 0 0 10px var(--red);
    }

    @keyframes ping {
      75%, 100% { transform: scale(2); opacity: 0; }
    }

    /* Glass Card with Cursor-Following Spotlight */
    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      position: relative;
      overflow: hidden;
      transition: border-color 0.3s ease, box-shadow 0.4s ease, transform 0.25s ease;
    }

    .glass-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(
        600px circle at var(--mouse-x, -500px) var(--mouse-y, -500px),
        rgba(255, 255, 255, 0.055),
        transparent 40%
      );
      pointer-events: none;
      z-index: 1;
    }

    .glass-card > * {
      position: relative;
      z-index: 2;
    }

    /* Hero Section */
    .hero-section {
      padding: 64px 0 40px;
      text-align: center;
      position: relative;
    }

    .eyebrow-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      border-radius: 9999px;
      background: rgba(34, 211, 238, 0.07);
      border: 1px solid rgba(34, 211, 238, 0.25);
      color: var(--cyan);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 22px;
    }

    .hero-headline {
      font-size: clamp(38px, 6vw, 68px);
      font-weight: 700;
      letter-spacing: -0.035em;
      line-height: 1.06;
      margin-bottom: 18px;
      color: var(--text-primary);
    }

    .gradient-sweep {
      background: linear-gradient(90deg, var(--cyan) 0%, #a855f7 35%, var(--magenta) 65%, var(--cyan) 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientFlow 5s linear infinite;
    }

    @keyframes gradientFlow {
      0% { background-position: 0% center; }
      100% { background-position: 200% center; }
    }

    .hero-subtitle {
      font-size: clamp(16px, 2vw, 19px);
      color: var(--text-muted);
      max-width: 680px;
      margin: 0 auto 32px;
      font-weight: 400;
    }

    .cta-group {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 13px 24px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      text-decoration: none;
      border: 1px solid transparent;
      outline: none;
    }
    .btn:focus-visible {
      box-shadow: 0 0 0 3px var(--cyan-glow), 0 0 0 1px var(--cyan);
    }
    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none !important;
    }

    .btn-cyan {
      background: linear-gradient(135deg, var(--cyan), #06b6d4);
      color: #04121a;
      box-shadow: 0 6px 24px rgba(34, 211, 238, 0.28);
    }
    .btn-cyan:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 32px rgba(34, 211, 238, 0.45);
    }

    .btn-glass {
      background: var(--glass-bg);
      color: var(--text-primary);
      border-color: var(--glass-border);
    }
    .btn-glass:hover:not(:disabled) {
      background: var(--glass-bg-hover);
      border-color: var(--glass-border-bright);
      transform: translateY(-1px);
    }

    .btn-record {
      background: rgba(255, 46, 136, 0.1);
      color: var(--magenta);
      border-color: rgba(255, 46, 136, 0.35);
    }
    .btn-record:hover:not(:disabled) {
      background: rgba(255, 46, 136, 0.18);
      box-shadow: 0 0 20px rgba(255, 46, 136, 0.25);
    }
    .btn-record.recording {
      background: var(--red);
      color: #fff;
      border-color: var(--red);
      animation: recordPulse 1.2s ease-in-out infinite;
    }

    @keyframes recordPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255, 77, 77, 0.6); }
      50% { box-shadow: 0 0 0 10px rgba(255, 77, 77, 0); }
    }

    /* Detector Workbench Layout */
    .workbench-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
      max-width: 1020px;
      margin: 0 auto;
    }

    /* Dropzone */
    .dropzone {
      border: 1.5px dashed rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 36px 24px;
      text-align: center;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.015);
      transition: all 0.25s ease;
      position: relative;
      outline: none;
    }
    .dropzone:hover, .dropzone:focus-visible, .dropzone.drag-active {
      border-color: var(--cyan);
      background: rgba(34, 211, 238, 0.045);
      box-shadow: inset 0 0 30px rgba(34, 211, 238, 0.06);
    }

    /* Sample & Mic Controls Bar */
    .controls-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--glass-border);
    }

    .sample-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--glass-border);
      color: var(--text-primary);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .sample-chip:hover {
      background: rgba(255, 255, 255, 0.09);
      border-color: var(--glass-border-bright);
    }
    .sample-chip.real:hover, .sample-chip.real.active {
      border-color: var(--green);
      background: rgba(52, 211, 153, 0.12);
      color: var(--green);
    }
    .sample-chip.fake:hover, .sample-chip.fake.active {
      border-color: var(--magenta);
      background: rgba(255, 46, 136, 0.12);
      color: var(--magenta);
    }

    /* Waveform & Spectrogram Panels */
    .acoustic-panel {
      background: rgba(4, 5, 10, 0.7);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      padding: 16px;
      margin-top: 18px;
      position: relative;
      overflow: hidden;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Scan Beam Overlay during Analyzing */
    .laser-scan-overlay {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 80px;
      background: linear-gradient(90deg, transparent, rgba(251, 191, 36, 0.28), rgba(251, 191, 36, 0.85), rgba(251, 191, 36, 0.28), transparent);
      pointer-events: none;
      z-index: 20;
      animation: laserSweep 1.35s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes laserSweep {
      0% { left: -80px; }
      100% { left: 100%; }
    }

    /* Verdict States: Bonafide & Spoof */
    .verdict-banner {
      border-radius: 18px;
      padding: 28px;
      margin-top: 24px;
      position: relative;
      overflow: hidden;
      transition: all 0.4s ease;
    }

    .verdict-banner.bonafide {
      background: linear-gradient(145deg, rgba(34, 211, 238, 0.08), rgba(52, 211, 153, 0.05));
      border: 1px solid rgba(52, 211, 153, 0.4);
      box-shadow: 0 0 40px rgba(52, 211, 153, 0.12);
    }

    .verdict-banner.spoof {
      background: linear-gradient(145deg, rgba(255, 46, 136, 0.1), rgba(255, 77, 77, 0.05));
      border: 1px solid rgba(255, 46, 136, 0.55);
      animation: spoofShake 0.32s cubic-bezier(0.36, 0.07, 0.19, 0.97) both, alertBorderPulse 2s infinite;
    }

    @keyframes spoofShake {
      0%, 100% { transform: translateX(0); }
      15%, 45%, 75% { transform: translateX(-7px); }
      30%, 60%, 90% { transform: translateX(7px); }
    }

    @keyframes alertBorderPulse {
      0%, 100% {
        box-shadow: 0 0 30px rgba(255, 46, 136, 0.18), inset 0 0 15px rgba(255, 46, 136, 0.1);
        border-color: rgba(255, 46, 136, 0.55);
      }
      50% {
        box-shadow: 0 0 50px rgba(255, 77, 77, 0.38), inset 0 0 25px rgba(255, 77, 77, 0.22);
        border-color: var(--red);
      }
    }

    /* RGB-Split Glitch Effect for Spoof Verdict Text */
    .rgb-glitch {
      position: relative;
      display: inline-block;
      color: #fff;
      text-shadow:
        -2px 0 var(--cyan),
        2px 0 var(--magenta);
      animation: glitchText 2.4s infinite;
    }

    @keyframes glitchText {
      0%, 92%, 100% {
        text-shadow: -1.5px 0 var(--cyan), 1.5px 0 var(--magenta);
        transform: translate(0);
      }
      94% {
        text-shadow: -4px -1px var(--cyan), 4px 1px var(--red);
        transform: translate(-2px, 1px);
      }
      96% {
        text-shadow: 3px 1px var(--cyan), -3px -1px var(--magenta);
        transform: translate(2px, -1px);
      }
      98% {
        text-shadow: -2px 0 var(--green), 2px 0 var(--red);
        transform: translate(0, 1px);
      }
    }

    /* Animated Check Ring for Bonafide */
    .check-ring-circle {
      stroke-dasharray: 160;
      stroke-dashoffset: 160;
      animation: drawRing 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .check-ring-tick {
      stroke-dasharray: 50;
      stroke-dashoffset: 50;
      animation: drawRing 0.45s cubic-bezier(0.16, 1, 0.3, 1) 0.35s forwards;
    }

    @keyframes drawRing {
      to { stroke-dashoffset: 0; }
    }

    /* Pipeline Horizontal Flow */
    .pipeline-track {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 14px;
      position: relative;
      margin-top: 40px;
    }

    .pipeline-step {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 20px 16px;
      position: relative;
      transition: all 0.3s ease;
    }
    .pipeline-step:hover {
      border-color: var(--cyan);
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(34, 211, 238, 0.12);
    }

    .pulse-connector {
      position: absolute;
      top: 50%;
      right: -15px;
      width: 16px;
      height: 2px;
      background: rgba(255, 255, 255, 0.12);
      z-index: 5;
      overflow: hidden;
    }
    .pulse-connector::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, var(--cyan), transparent);
      animation: pulseTravel 1.8s linear infinite;
    }

    @keyframes pulseTravel {
      0% { left: -100%; }
      100% { left: 100%; }
    }

    /* Responsive adjustments */
    @media (max-width: 1024px) {
      .pipeline-track {
        grid-template-columns: repeat(3, 1fr);
      }
      .pulse-connector { display: none; }
    }
    @media (max-width: 640px) {
      .pipeline-track {
        grid-template-columns: 1fr;
      }
      .nav-links { display: none; }
      .verdict-banner { padding: 20px; }
    }

    /* Reduced Motion Compliance */
    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <div class="cyber-grid"></div>
  <div class="noise-overlay"></div>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useReducer, useCallback, useMemo } = React;

    // ============================================================================
    // 1. CONFIG & MODEL FACTS (Single Source of Truth)
    // ============================================================================
    const CONFIG = {
      RISK_THRESHOLDS: {
        HIGH: 0.85,
        MEDIUM: 0.60,
      },
      MAX_FILE_SIZE_BYTES: 10 * 1024 * 1024, // 10 MB
      MIN_ANALYZING_MS: 1800,
      HEALTH_POLL_MS: 15000,
      MAX_RECORD_SEC: 30,
      FACTS: {
        dataset: 'ASVspoof 2019 Logical Access (LA)',
        trainClips: '25,380',
        devClips: '24,844',
        backbone: 'facebook/wav2vec2-base',
        preprocessing: 'Mono conversion & 16 kHz resample',
        transformerBlocks: '12 Transformer blocks → Mean-pooled 768-d vector',
        classifier: '768 → Dense 256 (BatchNorm, ReLU, Dropout 0.3) → Dense 64 (ReLU, Dropout 0.3) → 2 classes',
        training: 'Balanced class weights (spoof:bonafide ~9:1), AdamW (lr 1e-3), batch 128',
        devEer: '1.41%',
        eerThreshold: '0.6402',
        devAccuracy: '99.22%',
        latency: 'A few hundred ms on CPU',
      }
    };

    function getRiskClassification(prediction, spoofProb) {
      if (prediction === 'bonafide') {
        return { label: 'Authentic', color: 'var(--green)', bg: 'rgba(52, 211, 153, 0.14)', border: 'rgba(52, 211, 153, 0.4)' };
      }
      if (spoofProb >= CONFIG.RISK_THRESHOLDS.HIGH) {
        return { label: 'High Risk', color: 'var(--red)', bg: 'rgba(255, 77, 77, 0.16)', border: 'rgba(255, 77, 77, 0.5)' };
      }
      if (spoofProb >= CONFIG.RISK_THRESHOLDS.MEDIUM) {
        return { label: 'Medium Risk', color: 'var(--amber)', bg: 'rgba(251, 191, 36, 0.15)', border: 'rgba(251, 191, 36, 0.45)' };
      }
      return { label: 'Low Risk', color: 'var(--magenta)', bg: 'rgba(255, 46, 136, 0.14)', border: 'rgba(255, 46, 136, 0.4)' };
    }

    // ============================================================================
    // 2. BESPOKE SVG ICONS (Crisp Vector Icons)
    // ============================================================================
    const Icon = {
      ShieldCheck: ({ size = 20, color = 'currentColor' }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
          <path d="m9 12 2 2 4-4" />
        </svg>
      ),
      AlertOctagon: ({ size = 20, color = 'currentColor' }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <polygon points="7.86 2 16.14 2 22 7.86 22 16.14 16.14 22 7.86 22 2 16.14 2 7.86 7.86 2" />
          <line x1="12" y1="8" x2="12" y2="12" />
          <line x1="12" y1="16" x2="12.01" y2="16" />
        </svg>
      ),
      Mic: ({ size = 18, color = 'currentColor' }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" />

    // ============================================================================
    // 3. STATE MACHINE (useReducer, Single Source of Truth)
    // ============================================================================
    const initialState = {
      status: 'idle', // 'idle' | 'loaded' | 'analyzing' | 'result_bonafide' | 'result_spoof' | 'error'
      file: null,
      audioUrl: null,
      audioBuffer: null,
      activeSample: null, // 'real' | 'fake' | 'mic' | 'upload'
      analysisStep: 0, // 0: Resampling, 1: Wav2Vec2, 2: Classifying
      result: null,
      errorMsg: null,
      errorKind: null, // 'offline' | 'file' | 'timeout'
      history: [],
    };

    function detectorReducer(state, action) {
      switch (action.type) {
        case 'LOAD_FILE':
          return {
            ...state,
            status: 'loaded',
            file: action.file,
            audioUrl: action.audioUrl,
            audioBuffer: action.audioBuffer || null,
            activeSample: action.sampleType || 'upload',
            result: null,
            errorMsg: null,
            errorKind: null,
          };
        case 'SET_AUDIO_BUFFER':
          return {
            ...state,
            audioBuffer: action.audioBuffer,
          };
        case 'START_ANALYZING':
          return {
            ...state,
            status: 'analyzing',
            analysisStep: 0,
            errorMsg: null,
            errorKind: null,
          };
        case 'STEP_ANALYZING':
          return {
            ...state,
            analysisStep: action.step,
          };
        case 'SET_RESULT': {
          const nextStatus = action.result.prediction === 'bonafide' ? 'result_bonafide' : 'result_spoof';
          const historyEntry = {
            ...action.result,
            id: `${Date.now()}_${state.history.length + 1}`,
            runNumber: state.history.length + 1,
            timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
          };
          return {
            ...state,
            status: nextStatus,
            result: action.result,
            history: [...state.history, historyEntry],
          };
        }
        case 'RELOAD_HISTORY_ITEM': {
          const item = action.item;
          return {
            ...state,
            status: item.prediction === 'bonafide' ? 'result_bonafide' : 'result_spoof',
            result: item,
          };
        }
        case 'SET_ERROR':
          return {
            ...state,
            status: 'error',
            errorMsg: action.msg,
            errorKind: action.kind || 'file',
          };
        case 'RESET':
          return {
            ...state,
            status: 'idle',
            file: null,
            audioUrl: null,
            audioBuffer: null,
            activeSample: null,
            result: null,
            errorMsg: null,
            errorKind: null,
          };
        default:
          return state;
      }
    }

    // ============================================================================
    // 4. RADIX-2 COOLEY-TUKEY FFT FOR REAL SPECTROGRAM COMPUTATION
    // ============================================================================
    function computeFFT(real, imag) {
      const n = real.length;
      if (n <= 1) return;

      // Bit-reversal permutation
      let j = 0;
      for (let i = 0; i < n; i++) {
        if (i < j) {
          const tr = real[j]; real[j] = real[i]; real[i] = tr;
          const ti = imag[j]; imag[j] = imag[i]; imag[i] = ti;
        }
        let m = n >> 1;
        while (m >= 1 && j >= m) {
          j -= m;
          m >>= 1;
        }
        j += m;
      }

      // Butterfly updates
      for (let s = 2; s <= n; s <<= 1) {
        const half = s >> 1;
        const angleStep = (-2 * Math.PI) / s;
        const wStepR = Math.cos(angleStep);
        const wStepI = Math.sin(angleStep);

        for (let k = 0; k < n; k += s) {
          let wR = 1;
          let wI = 0;
          for (let m = 0; m < half; m++) {
            const idx1 = k + m;
            const idx2 = idx1 + half;
            const tR = wR * real[idx2] - wI * imag[idx2];
            const tI = wR * imag[idx2] + wI * real[idx2];
            real[idx2] = real[idx1] - tR;
            imag[idx2] = imag[idx1] - tI;
            real[idx1] += tR;
            imag[idx1] += tI;
            const nextWR = wR * wStepR - wI * wStepI;
            wI = wR * wStepI + wI * wStepR;
            wR = nextWR;
          }
        }
      }
    }

    // Forensic Colormap: Deep Void (#07080d) -> Cyan (#22d3ee) -> Magenta (#ff2e88) -> White (#ffffff)
    function getSpectrogramRGB(normVal) {
      const v = Math.max(0, Math.min(1, normVal));
      if (v < 0.25) {
        const t = v / 0.25;
        return [
          Math.round(7 + t * (14 - 7)),
          Math.round(8 + t * (116 - 8)),
          Math.round(13 + t * (144 - 13)),
        ];
      } else if (v < 0.55) {
        const t = (v - 0.25) / 0.30;
        return [
          Math.round(14 + t * (34 - 14)),
          Math.round(116 + t * (211 - 116)),
          Math.round(144 + t * (238 - 144)),
        ];
      } else if (v < 0.85) {
        const t = (v - 0.55) / 0.30;
        return [
          Math.round(34 + t * (255 - 34)),
          Math.round(211 + t * (46 - 211)),
          Math.round(238 + t * (136 - 238)),
        ];
      } else {
        const t = (v - 0.85) / 0.15;
        return [
          255,
          Math.round(46 + t * (255 - 46)),
          Math.round(136 + t * (255 - 136)),
        ];
      }
    }

    // ============================================================================
    // 5. COMPONENT: 3D HARMONIC SOUND ORB + 64 MIRRORED FREQUENCY BARS
    // ============================================================================
    function SoundOrbAndBars({ status, getFrequencyData, isPlayingOrRecording }) {
      const canvasRef = useRef(null);
      const smoothedBarsRef = useRef(new Float32Array(64));

      // Precompute 160 Fibonacci sphere points for 3D orb
      const spherePoints = useMemo(() => {
        const pts = [];
        const N = 160;
        const goldenAngle = Math.PI * (3 - Math.sqrt(5));
        for (let i = 0; i < N; i++) {
          const y = 1 - (i / (N - 1)) * 2;
          const radius = Math.sqrt(1 - y * y);
          const theta = goldenAngle * i;
          pts.push({
            bx: Math.cos(theta) * radius,
            by: y,
            bz: Math.sin(theta) * radius,
            phase: i * 0.13,
          });
        }
        return pts;
      }, []);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const width = 760;
        const height = 290;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        ctx.scale(dpr, dpr);

        let rafId;
        let t = 0;
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        const render = () => {
          // State-driven palette & physics
          let rgbPrimary = [34, 211, 238]; // Cyan
          let rgbSecondary = [52, 211, 153]; // Green
          let rotSpeed = 0.008;
          let spikeFactor = 0.08;

          if (status === 'analyzing') {
            rgbPrimary = [251, 191, 36]; // Amber
            rgbSecondary = [34, 211, 238];
            rotSpeed = 0.032;
            spikeFactor = 0.22;
          } else if (status === 'result_bonafide') {
            rgbPrimary = [52, 211, 153]; // Green
            rgbSecondary = [34, 211, 238];
            rotSpeed = 0.011;
            spikeFactor = 0.05;
          } else if (status === 'result_spoof') {
            rgbPrimary = [255, 46, 136]; // Magenta
            rgbSecondary = [255, 77, 77]; // Red
            rotSpeed = 0.025;
            spikeFactor = 0.38;
          } else if (status === 'error') {
            rgbPrimary = [255, 77, 77];
            rgbSecondary = [251, 191, 36];
            rotSpeed = 0.004;
          }

          if (!reducedMotion) {
            t += rotSpeed;
          }

          ctx.clearRect(0, 0, width, height);

          // Sample live frequency data from Web Audio API or synthesize organic spectrum
          const rawFreq = getFrequencyData ? getFrequencyData() : null;
          const bars = smoothedBarsRef.current;
          let avgEnergy = 0;

          for (let i = 0; i < 64; i++) {
            let target = 0.06;
            if (isPlayingOrRecording && rawFreq && rawFreq.length > 0) {
              const bin = Math.min(rawFreq.length - 1, Math.floor((i / 64) * (rawFreq.length * 0.7)));
              target = Math.max(0.05, rawFreq[bin] / 255.0);
            } else if (status === 'analyzing') {
              const wave1 = Math.sin(i * 0.22 - t * 4.5) * 0.5 + 0.5;
              const wave2 = Math.cos(i * 0.11 + t * 2.5) * 0.5 + 0.5;
              target = 0.15 + wave1 * wave2 * 0.75;
            } else if (status === 'result_bonafide') {
              // Clean harmonic sine wave
              target = 0.18 + Math.sin(i * 0.15 + t * 2.0) * 0.14 + Math.cos(i * 0.08 - t) * 0.08;
            } else if (status === 'result_spoof') {
              // Jagged glitch peaks
              const glitch = Math.sin(i * 1.7 + t * 8.0) * Math.cos(i * 0.9 - t * 5.0);
              target = 0.12 + Math.abs(glitch) * 0.78;
            } else {
              // Idle / Loaded gentle breathing
              target = 0.07 + Math.sin(i * 0.18 + t * 1.6) * 0.05;
            }

            // Lerp smoothing
            bars[i] += (target - bars[i]) * 0.22;
            avgEnergy += bars[i];
          }
          avgEnergy /= 64;

          const cx = width / 2;
          const cy = 118;
          const baseRadius = 74 + avgEnergy * 24;

          // 1. Ambient Core Glow
          const coreGrad = ctx.createRadialGradient(cx, cy, 8, cx, cy, baseRadius * 1.75);
          coreGrad.addColorStop(0, `rgba(${rgbPrimary.join(',')}, 0.38)`);
          coreGrad.addColorStop(0.45, `rgba(${rgbSecondary.join(',')}, 0.12)`);
          coreGrad.addColorStop(1, 'rgba(7, 8, 13, 0)');
          ctx.fillStyle = coreGrad;
          ctx.beginPath();
          ctx.arc(cx, cy, baseRadius * 1.75, 0, Math.PI * 2);
          ctx.fill();

          // 2. Concentric Telemetry Rings
          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(t * 0.5);
          ctx.strokeStyle = `rgba(${rgbPrimary.join(',')}, 0.18)`;
          ctx.lineWidth = 1;
          ctx.setLineDash([6, 10]);
          ctx.beginPath();
          ctx.arc(0, 0, baseRadius * 1.22, 0, Math.PI * 2);
          ctx.stroke();

          ctx.rotate(-t * 1.1);
          ctx.strokeStyle = `rgba(${rgbSecondary.join(',')}, 0.14)`;
          ctx.setLineDash([3, 14]);
          ctx.beginPath();
          ctx.arc(0, 0, baseRadius * 1.36, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();

          // 3. 3D Fibonacci Point Cloud Sphere
          const projected = [];
          const cosY = Math.cos(t);
          const sinY = Math.sin(t);
          const cosX = Math.cos(t * 0.6);
          const sinX = Math.sin(t * 0.6);

          for (let i = 0; i < spherePoints.length; i++) {
            const p = spherePoints[i];
            const barVal = bars[i % 64];
            const distortion = 1 + Math.sin(p.phase + t * 3) * spikeFactor + barVal * 0.35;

            const x0 = p.bx * baseRadius * distortion;
            const y0 = p.by * baseRadius * distortion;
            const z0 = p.bz * baseRadius * distortion;

            // Rotate Y then X
            const x1 = x0 * cosY - z0 * sinY;
            const z1 = z0 * cosY + x0 * sinY;
            const y2 = y0 * cosX - z1 * sinX;
            const z2 = z1 * cosX + y0 * sinX;

            const fov = 260;
            const scale = fov / (fov + z2 + baseRadius);
            projected.push({
              x: cx + x1 * scale,
              y: cy + y2 * scale,
              z: z2,
              scale,
              energy: barVal,
            });
          }

          // Sort back-to-front
          projected.sort((a, b) => a.z - b.z);

          // Draw subtle geodesic filaments between nearby front points
          ctx.lineWidth = 0.75;
          for (let i = 0; i < projected.length; i += 2) {
            const p1 = projected[i];
            if (p1.z < 0) continue;
            for (let j = i + 1; j < Math.min(projected.length, i + 8); j++) {
              const p2 = projected[j];
              const dx = p1.x - p2.x;
              const dy = p1.y - p2.y;
              const distSq = dx * dx + dy * dy;
              if (distSq < 780) {
                const alpha = (1 - distSq / 780) * 0.28;
                ctx.strokeStyle = `rgba(${rgbPrimary.join(',')}, ${alpha})`;
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.stroke();
              }
            }
          }

          // Draw 3D vertices
          for (let i = 0; i < projected.length; i++) {
            const p = projected[i];
            const depthAlpha = Math.max(0.12, Math.min(0.95, (p.z + baseRadius) / (2 * baseRadius)));
            const r = Math.max(1.1, p.scale * (1.8 + p.energy * 1.6));
            ctx.fillStyle = p.energy > 0.45
              ? `rgba(${rgbSecondary.join(',')}, ${depthAlpha})`
              : `rgba(${rgbPrimary.join(',')}, ${depthAlpha})`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
            ctx.fill();
          }

          // 4. 64 Mirrored Lerp-Smoothed Frequency Bars (Bottom Telemetry Deck)
          const deckCenterY = 248;
          const totalBarsWidth = 540;
          const startX = (width - totalBarsWidth) / 2;
          const barSpacing = totalBarsWidth / 64;
          const barWidth = Math.max(2.5, barSpacing - 3);

          // Baseline horizon
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.07)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(startX - 20, deckCenterY);
          ctx.lineTo(startX + totalBarsWidth + 20, deckCenterY);
          ctx.stroke();

          for (let i = 0; i < 64; i++) {
            // Mirror index from center outward so low/mid frequencies anchor center
            const mirrorIdx = i < 32 ? (31 - i) * 2 : (i - 32) * 2;
            const val = bars[mirrorIdx];
            const halfH = Math.max(2, val * 34);
            const x = startX + i * barSpacing;

            const barGrad = ctx.createLinearGradient(x, deckCenterY - halfH, x, deckCenterY + halfH);
            barGrad.addColorStop(0, `rgba(${rgbPrimary.join(',')}, 0.95)`);
            barGrad.addColorStop(0.5, `rgba(${rgbSecondary.join(',')}, 0.95)`);
            barGrad.addColorStop(1, `rgba(${rgbPrimary.join(',')}, 0.35)`);

            ctx.fillStyle = barGrad;
            ctx.beginPath();
            ctx.roundRect(x, deckCenterY - halfH, barWidth, halfH * 2, 2);
            ctx.fill();
          }

          rafId = requestAnimationFrame(render);
        };

        render();
        return () => cancelAnimationFrame(rafId);
      }, [status, getFrequencyData, isPlayingOrRecording, spherePoints]);

      return (
        <div style={{ width: '100%', display: 'flex', flexDirection: 'column', alignItems: 'center', margin: '4px 0 8px' }}>
          <canvas
            ref={canvasRef}
            style={{ width: '100%', maxWidth: '760px', height: '290px', display: 'block' }}
            aria-label="Interactive 3D sound orb and 64-channel mirrored frequency analyzer"
          />
          <div className="mono" style={{ fontSize: '11px', color: 'var(--text-dim)', letterSpacing: '0.08em', textTransform: 'uppercase', marginTop: '-6px' }}>
            {status === 'idle' && '● STANDBY // 64-CHANNEL HARMONIC FIELD READY'}
            {status === 'loaded' && '● SIGNAL LOCKED // PRESS PLAY TO DRIVE REAL-TIME ANALYSER'}
            {status === 'analyzing' && '⚡ NEURAL SCAN ACTIVE // EXTRACTING WAV2VEC2 EMBEDDINGS'}
            {status === 'result_bonafide' && '✓ VERIFIED AUTHENTIC // NATURAL HUMAN FORMANT DISTRIBUTION'}
            {status === 'result_spoof' && '⚠ ANOMALY DETECTED // SYNTHETIC VOCODER ARTIFACTS PRESENT'}
            {status === 'error' && '✕ TELEMETRY FAULT // CHECK INPUT OR API STATUS'}
          </div>
        </div>
      );
    }

    // ============================================================================
    // 6. COMPONENT: REAL CLIENT-SIDE FFT SPECTROGRAM CANVAS
    // ============================================================================
    function SpectrogramCanvas({ audioBuffer, isAnalyzing }) {
      const canvasRef = useRef(null);
      const [hoverInfo, setHoverInfo] = useState(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas || !audioBuffer) return;

        const ctx = canvas.getContext('2d');
        const width = 680;
        const height = 128;
        canvas.width = width;
        canvas.height = height;

        const channelData = audioBuffer.getChannelData(0);
        const fftSize = 512;
        const halfFft = fftSize >> 1;
        const numCols = width;
        const step = Math.max(1, Math.floor((channelData.length - fftSize) / numCols));

        // Precompute Hann window
        const hann = new Float32Array(fftSize);
        for (let i = 0; i < fftSize; i++) {
          hann[i] = 0.5 * (1 - Math.cos((2 * Math.PI * i) / (fftSize - 1)));
        }

        const imgData = ctx.createImageData(width, height);
        const pixels = imgData.data;
        const real = new Float32Array(fftSize);
        const imag = new Float32Array(fftSize);

        for (let col = 0; col < numCols; col++) {
          const startSample = col * step;
          for (let i = 0; i < fftSize; i++) {
            const s = startSample + i < channelData.length ? channelData[startSample + i] : 0;
            real[i] = s * hann[i];
            imag[i] = 0;
          }

          computeFFT(real, imag);

          for (let row = 0; row < height; row++) {
            // Map row (0 = top = high freq, height-1 = bottom = low freq)
            const freqRatio = 1 - row / height;
            const bin = Math.min(halfFft - 1, Math.floor(freqRatio * (halfFft * 0.85)));
            const mag = Math.sqrt(real[bin] * real[bin] + imag[bin] * imag[bin]) / (fftSize * 0.15);
            const dbNorm = Math.max(0, Math.min(1, (20 * Math.log10(mag + 1e-6) + 65) / 65));

            const [r, g, b] = getSpectrogramRGB(dbNorm);
            const pIdx = (row * width + col) * 4;
            pixels[pIdx] = r;
            pixels[pIdx + 1] = g;
            pixels[pIdx + 2] = b;
            pixels[pIdx + 3] = 255;
          }
        }

        ctx.putImageData(imgData, 0, 0);
      }, [audioBuffer]);

      const handleMouseMove = (e) => {
        if (!audioBuffer || !canvasRef.current) return;
        const rect = canvasRef.current.getBoundingClientRect();
        const xRatio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        const yRatio = Math.max(0, Math.min(1, 1 - (e.clientY - rect.top) / rect.height));
        const timeSec = (xRatio * audioBuffer.duration).toFixed(2);
        const maxFreqKhz = (audioBuffer.sampleRate / 2000) * 0.85;
        const freqKhz = (yRatio * maxFreqKhz).toFixed(2);
        setHoverInfo({ timeSec, freqKhz });
      };

      if (!audioBuffer) return null;

      return (
        <div className="acoustic-panel">
          {isAnalyzing && <div className="laser-scan-overlay"></div>}
          <div className="panel-header mono">
            <span style={{ display: 'flex', alignItems: 'center', gap: '6px', color: 'var(--cyan)' }}>
              <Icon.Activity size={14} /> STFT ACOUSTIC SPECTROGRAM (HANN 512-PT FFT)
            </span>
            <span>
              {hoverInfo
                ? `T: ${hoverInfo.timeSec}s | F: ${hoverInfo.freqKhz} kHz`
                : `SR: ${(audioBuffer.sampleRate / 1000).toFixed(1)} kHz • DURATION: ${audioBuffer.duration.toFixed(2)}s`}
            </span>
          </div>
          <div style={{ position: 'relative', borderRadius: '8px', overflow: 'hidden', border: '1px solid rgba(255,255,255,0.08)' }}>
            <canvas
              ref={canvasRef}
              onMouseMove={handleMouseMove}
              onMouseLeave={() => setHoverInfo(null)}

    // ============================================================================
    // 7. COMPONENT: ANIMATED SEMICIRCULAR SPOOF PROBABILITY GAUGE
    // ============================================================================
    function SpoofGauge({ spoofProbability, prediction }) {
      const [displayPct, setDisplayPct] = useState(0);

      useEffect(() => {
        const target = spoofProbability * 100;
        let start = null;
        const duration = 950;
        let raf;

        const step = (ts) => {
          if (!start) start = ts;
          const progress = Math.min(1, (ts - start) / duration);
          // Ease out cubic
          const eased = 1 - Math.pow(1 - progress, 3);
          setDisplayPct(target * eased);
          if (progress < 1) {
            raf = requestAnimationFrame(step);
          }
        };

        raf = requestAnimationFrame(step);
        return () => cancelAnimationFrame(raf);
      }, [spoofProbability]);

      const angleDeg = -90 + (displayPct / 100) * 180;
      const isSpoof = prediction === 'spoof';

      return (
        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', position: 'relative' }}>
          <svg width="250" height="142" viewBox="0 0 250 142">
            <defs>
              <linearGradient id="gaugeArcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stopColor="#34d399" />
                <stop offset="50%" stopColor="#fbbf24" />
                <stop offset="100%" stopColor="#ff2e88" />
              </linearGradient>
            </defs>

            {/* Background Track */}
            <path
              d="M 25 122 A 100 100 0 0 1 225 122"
              fill="none"
              stroke="rgba(255, 255, 255, 0.08)"
              strokeWidth="16"
              strokeLinecap="round"
            />

            {/* Colored Gradient Track */}
            <path
              d="M 25 122 A 100 100 0 0 1 225 122"
              fill="none"
              stroke="url(#gaugeArcGrad)"
              strokeWidth="16"
              strokeLinecap="round"
              strokeDasharray="314.16"
              strokeDashoffset={314.16 * (1 - displayPct / 100)}
            />

            {/* Threshold Ticks (60% Medium, 85% High) */}
            <text x="16" y="138" fill="var(--text-dim)" fontSize="10" className="mono">0%</text>
            <text x="116" y="14" fill="var(--text-dim)" fontSize="10" className="mono">50%</text>
            <text x="216" y="138" fill="var(--text-dim)" fontSize="10" className="mono">100%</text>

            {/* Spring Needle */}
            <g
              transform={`rotate(${angleDeg} 125 122)`}
              style={{ transition: 'transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1)' }}
            >
              <polygon points="122,122 125,32 128,122" fill="#ffffff" />
              <circle cx="125" cy="122" r="8" fill={isSpoof ? 'var(--magenta)' : 'var(--green)'} stroke="#ffffff" strokeWidth="2.5" />
            </g>
          </svg>

          <div style={{ textAlign: 'center', marginTop: '-10px' }}>
            <div className="mono" style={{ fontSize: '34px', fontWeight: 700, color: isSpoof ? 'var(--magenta)' : 'var(--green)', letterSpacing: '-0.03em' }}>
              {displayPct.toFixed(1)}%
            </div>
            <div className="mono" style={{ fontSize: '11px', color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: '0.08em' }}>
              Spoof Probability Score
            </div>
          </div>
        </div>
      );
    }

    // ============================================================================
    // 8. COMPONENT: SESSION HISTORY INTERACTIVE CHART
    // ============================================================================
    function SessionHistoryChart({ history, onSelectRun }) {
      if (!history || history.length === 0) {
        return (
          <div className="glass-card" style={{ padding: '24px', marginTop: '24px', textAlign: 'center' }}>
            <div className="mono" style={{ fontSize: '12px', color: 'var(--text-muted)' }}>
              SESSION TELEMETRY LOG // Analyze audio clips above to populate real-time session probability trends.
            </div>
          </div>
        );
      }

      const width = 760;
      const height = 180;
      const padLeft = 44;
      const padRight = 24;
      const padTop = 20;
      const padBottom = 32;
      const plotW = width - padLeft - padRight;
      const plotH = height - padTop - padBottom;

      const points = history.map((item, idx) => {
        const x = history.length === 1
          ? padLeft + plotW / 2
          : padLeft + (idx / (history.length - 1)) * plotW;
        const y = padTop + (1 - item.probabilities.spoof) * plotH;
        return { x, y, item };
      });

      const polylineStr = points.map((p) => `${p.x},${p.y}`).join(' ');
      const y85 = padTop + (1 - 0.85) * plotH;
      const y60 = padTop + (1 - 0.60) * plotH;

      return (
        <div className="glass-card" style={{ padding: '28px', marginTop: '24px' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px', flexWrap: 'wrap', gap: '10px' }}>
            <div>
              <h3 style={{ fontSize: '18px', fontWeight: 700 }}>Session Analysis Telemetry</h3>
              <p style={{ fontSize: '13px', color: 'var(--text-muted)' }}>
                Spoof probability per analysis in this browser session ({history.length} {history.length === 1 ? 'clip' : 'clips'} evaluated)
              </p>
            </div>
            <div className="mono" style={{ display: 'flex', gap: '16px', fontSize: '11px' }}>
              <span style={{ color: 'var(--red)' }}>--- High Risk (85%)</span>
              <span style={{ color: 'var(--amber)' }}>--- Medium Risk (60%)</span>
            </div>
          </div>

          <svg viewBox={`0 0 ${width} ${height}`} style={{ width: '100%', height: 'auto', overflow: 'visible' }}>
            {/* Reference Lines */}
            <line x1={padLeft} y1={y85} x2={width - padRight} y2={y85} stroke="rgba(255, 77, 77, 0.35)" strokeDasharray="4 4" strokeWidth="1" />
            <line x1={padLeft} y1={y60} x2={width - padRight} y2={y60} stroke="rgba(251, 191, 36, 0.35)" strokeDasharray="4 4" strokeWidth="1" />
            <line x1={padLeft} y1={padTop + plotH} x2={width - padRight} y2={padTop + plotH} stroke="rgba(255, 255, 255, 0.1)" strokeWidth="1" />

            <text x="6" y={y85 + 4} fill="var(--red)" fontSize="10" className="mono">85%</text>
            <text x="6" y={y60 + 4} fill="var(--amber)" fontSize="10" className="mono">60%</text>
            <text x="12" y={padTop + plotH + 4} fill="var(--text-dim)" fontSize="10" className="mono">0%</text>

            {/* Connecting Line */}
            {points.length > 1 && (
              <polyline
                fill="none"
                stroke="var(--cyan)"
                strokeWidth="2.5"
                points={polylineStr}
              />
            )}

            {/* Data Points */}
            {points.map((p, idx) => {
              const isSpoof = p.item.prediction === 'spoof';
              return (
                <g
                  key={p.item.id}
                  style={{ cursor: 'pointer' }}
                  onClick={() => onSelectRun(p.item)}
                >
                  <circle
                    cx={p.x}
                    cy={p.y}
                    r="6"
                    fill={isSpoof ? 'var(--magenta)' : 'var(--green)'}
                    stroke="#07080d"
                    strokeWidth="2"
                  />
                  <text
                    x={p.x}
                    y={p.y - 12}
                    textAnchor="middle"
                    fill="var(--text-primary)"
                    fontSize="10"
                    className="mono"
                  >
                    {(p.item.probabilities.spoof * 100).toFixed(1)}%
                  </text>
                  <text
                    x={p.x}
                    y={padTop + plotH + 18}
                    textAnchor="middle"
                    fill="var(--text-muted)"
                    fontSize="10"
                    className="mono"
                  >
                    #{idx + 1}
                  </text>
                </g>
              );
            })}
          </svg>
        </div>
      );
    }

    // ============================================================================
    // 9. MAIN FORENSICS APPLICATION
    // ============================================================================
    function App() {
      const [state, dispatch] = useReducer(detectorReducer, initialState);
      const [health, setHealth] = useState({ online: true, device: 'cpu', ready: true });
      const [isPlaying, setIsPlaying] = useState(false);
      const [currentTime, setCurrentTime] = useState(0);
      const [duration, setDuration] = useState(0);
      const [playbackRate, setPlaybackRate] = useState(1.0);

      // Microphone recording state
      const [isRecording, setIsRecording] = useState(false);
      const [recordSeconds, setRecordSeconds] = useState(0);
      const [micLevel, setMicLevel] = useState(0);

      // Refs for audio & animations
      const waveformContainerRef = useRef(null);
      const wavesurferRef = useRef(null);
      const audioCtxRef = useRef(null);
      const analyserRef = useRef(null);
      const mediaRecorderRef = useRef(null);
      const micStreamRef = useRef(null);
      const micRafRef = useRef(null);
      const recordIntervalRef = useRef(null);

      // Spotlight mouse tracker for glass cards
      const handleCardMouseMove = useCallback((e) => {
        const card = e.currentTarget;
        const rect = card.getBoundingClientRect();
        card.style.setProperty('--mouse-x', `${e.clientX - rect.left}px`);
        card.style.setProperty('--mouse-y', `${e.clientY - rect.top}px`);
      }, []);

      // 1. Poll GET /health every 15s
      useEffect(() => {
        const pollHealth = async () => {
          try {
            const res = await fetch('/health');
            if (!res.ok) throw new Error('Health non-200');
            const data = await res.json();
            setHealth({
              online: data.status === 'healthy',
              device: data.device || 'cpu',
              ready: Boolean(data.wav2vec2_loaded && data.classifier_loaded),
            });
          } catch {
            setHealth((prev) => ({ ...prev, online: false, ready: false }));
          }
        };
        pollHealth();
        const id = setInterval(pollHealth, CONFIG.HEALTH_POLL_MS);
        return () => clearInterval(id);
      }, []);

      // 2. Ensure Web Audio AnalyserNode
      const ensureAudioAnalyser = useCallback(() => {
        if (!audioCtxRef.current) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          audioCtxRef.current = new AudioCtx();
        }
        if (audioCtxRef.current.state === 'suspended') {
          audioCtxRef.current.resume();
        }
        if (!analyserRef.current) {
          const analyser = audioCtxRef.current.createAnalyser();
          analyser.fftSize = 256;
          analyser.smoothingTimeConstant = 0.78;
          analyserRef.current = analyser;
        }
        return { ctx: audioCtxRef.current, analyser: analyserRef.current };
      }, []);

      const getFrequencyData = useCallback(() => {
        if (!analyserRef.current) return null;
        const arr = new Uint8Array(analyserRef.current.frequencyBinCount);
        analyserRef.current.getByteFrequencyData(arr);
        return arr;
      }, []);

      // 3. Decode Audio File for FFT Spectrogram + WaveSurfer
      const processSelectedFile = useCallback(async (file, sampleType = 'upload') => {
        const validExt = /\.(wav|flac|mp3|m4a|webm|ogg)$/i.test(file.name);
        if (!file.type.startsWith('audio/') && !validExt) {
          dispatch({
            type: 'SET_ERROR',
            msg: 'Unsupported file format. Please provide a WAV, FLAC, MP3, or M4A audio clip.',
            kind: 'file',
          });
          return;
        }
        if (file.size > CONFIG.MAX_FILE_SIZE_BYTES) {
          dispatch({
            type: 'SET_ERROR',
            msg: `File size (${(file.size / (1024 * 1024)).toFixed(1)} MB) exceeds the 10 MB forensic limit.`,
            kind: 'file',
          });
          return;
        }

        const url = URL.createObjectURL(file);
        dispatch({ type: 'LOAD_FILE', file, audioUrl: url, sampleType });

        // Decode audio data for client-side FFT spectrogram
        try {
          const arrayBuf = await file.arrayBuffer();
          const { ctx } = ensureAudioAnalyser();
          const decoded = await ctx.decodeAudioData(arrayBuf.slice(0));
          dispatch({ type: 'SET_AUDIO_BUFFER', audioBuffer: decoded });
        } catch {
          // Non-fatal if browser cannot decode a specific container for client preview; backend will still process
        }
      }, [ensureAudioAnalyser]);

      // 4. Mount WaveSurfer when audioUrl changes
      useEffect(() => {
        if (!state.audioUrl || !waveformContainerRef.current) return;

        if (wavesurferRef.current) {
          wavesurferRef.current.destroy();
        }

        const ws = WaveSurfer.create({
          container: waveformContainerRef.current,
          waveColor: '#3b4254',
          progressColor: '#22d3ee',
          cursorColor: '#ffffff',
          cursorWidth: 2,
          height: 76,
          barWidth: 2,
          barGap: 2,
          barRadius: 2,
          normalize: true,
          url: state.audioUrl,
        });

        ws.on('ready', () => {
          setDuration(ws.getDuration());
          setCurrentTime(0);
          setIsPlaying(false);

          // Connect WaveSurfer HTMLMediaElement to Web Audio API AnalyserNode
          try {
            const mediaEl = ws.getMediaElement();
            if (mediaEl) {
              const { ctx, analyser } = ensureAudioAnalyser();
              const source = ctx.createMediaElementSource(mediaEl);
              source.connect(analyser);
              analyser.connect(ctx.destination);
            }
          } catch {
            // Ignore if already connected
          }
        });

        ws.on('timeupdate', (t) => setCurrentTime(t));
        ws.on('play', () => setIsPlaying(true));
        ws.on('pause', () => setIsPlaying(false));
        ws.on('finish', () => setIsPlaying(false));

        wavesurferRef.current = ws;
        return () => {
          ws.destroy();
        };
      }, [state.audioUrl, ensureAudioAnalyser]);

      // Update wave color dynamically based on result state
      useEffect(() => {
        const ws = wavesurferRef.current;
        if (!ws) return;
        if (state.status === 'result_bonafide') {
          ws.setOptions({ waveColor: 'rgba(52, 211, 153, 0.45)', progressColor: '#34d399' });
        } else if (state.status === 'result_spoof') {
          ws.setOptions({ waveColor: 'rgba(255, 46, 136, 0.45)', progressColor: '#ff2e88' });
        } else if (state.status === 'analyzing') {
          ws.setOptions({ waveColor: 'rgba(251, 191, 36, 0.45)', progressColor: '#fbbf24' });
        }
      }, [state.status]);

      // 5. Load Standard Sample Chips
      const loadSample = async (kind) => {
        const path = kind === 'real' ? '/samples/real_sample.wav' : '/samples/fake_sample.wav';
        try {
          const res = await fetch(path);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const blob = await res.blob();
          const file = new File([blob], kind === 'real' ? 'real_sample.wav' : 'fake_sample.wav', { type: 'audio/wav' });
          await processSelectedFile(file, kind);
        } catch {
          dispatch({
            type: 'SET_ERROR',
            msg: `Could not load ${path}. Ensure sample WAV files exist in /public/samples/.`,
            kind: 'file',
          });
        }
      };

      // 6. Microphone Recording with Live Level Meter & 30s Auto-Stop
      const stopRecording = useCallback(() => {
        if (mediaRecorderRef.current && mediaRecorderRef.current.state !== 'inactive') {
          mediaRecorderRef.current.stop();
        }
        if (recordIntervalRef.current) {
          clearInterval(recordIntervalRef.current);
          recordIntervalRef.current = null;
        }
        if (micRafRef.current) {
          cancelAnimationFrame(micRafRef.current);
          micRafRef.current = null;
        }
        setIsRecording(false);
        setMicLevel(0);
      }, []);

      const toggleMicRecording = async () => {
        if (isRecording) {
          stopRecording();
          return;
        }

        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          micStreamRef.current = stream;

          const { ctx, analyser } = ensureAudioAnalyser();
          const source = ctx.createMediaStreamSource(stream);
          source.connect(analyser);

          const mr = new MediaRecorder(stream);
          mediaRecorderRef.current = mr;
          const chunks = [];

          mr.ondataavailable = (e) => {
            if (e.data.size > 0) chunks.push(e.data);
          };

          mr.onstop = () => {
            const blob = new Blob(chunks, { type: 'audio/wav' });
            const file = new File([blob], `mic_recording_${Date.now()}.wav`, { type: 'audio/wav' });
            processSelectedFile(file, 'mic');
            stream.getTracks().forEach((t) => t.stop());
          };

          mr.start();
          setIsRecording(true);
          setRecordSeconds(0);

          recordIntervalRef.current = setInterval(() => {
            setRecordSeconds((s) => {
              if (s + 1 >= CONFIG.MAX_RECORD_SEC) {
                stopRecording();
                return CONFIG.MAX_RECORD_SEC;
              }
              return s + 1;
            });
          }, 1000);

          const timeData = new Uint8Array(analyser.fftSize);
          const updateMeter = () => {
            analyser.getByteTimeDomainData(timeData);
            let sum = 0;
            for (let i = 0; i < timeData.length; i++) {
              const v = (timeData[i] - 128) / 128;
              sum += v * v;
            }
            const rms = Math.min(1, Math.sqrt(sum / timeData.length) * 3.5);
            setMicLevel(rms);
            micRafRef.current = requestAnimationFrame(updateMeter);
          };
          micRafRef.current = requestAnimationFrame(updateMeter);
        } catch {
          dispatch({
            type: 'SET_ERROR',
            msg: 'Microphone access was denied or no recording device is available.',
            kind: 'file',
          });
        }
      };

      // 7. POST /predict with Minimum 1.8s Analyzing Stepper
      const handleAnalyze = async () => {
        if (!state.file || state.status === 'analyzing') return;

        dispatch({ type: 'START_ANALYZING' });
        const step1Timer = setTimeout(() => dispatch({ type: 'STEP_ANALYZING', step: 1 }), 600);
        const step2Timer = setTimeout(() => dispatch({ type: 'STEP_ANALYZING', step: 2 }), 1200);

        const t0 = performance.now();
        const formData = new FormData();
        formData.append('file', state.file);

        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 25000);

        try {
          const res = await fetch('/predict', {
            method: 'POST',
            body: formData,
            signal: controller.signal,
          });

          if (!res.ok) {
            let errDetail = `Server error (${res.status})`;
            try {
              const errJson = await res.json();
              if (errJson.detail) errDetail = errJson.detail;
            } catch {}
            throw { message: errDetail, kind: res.status === 400 ? 'file' : 'offline' };
          }

          const data = await res.json();
          const elapsed = performance.now() - t0;
          const remaining = Math.max(0, CONFIG.MIN_ANALYZING_MS - elapsed);

          setTimeout(() => {
            dispatch({ type: 'SET_RESULT', result: data });
          }, remaining);
        } catch (err) {
          clearTimeout(step1Timer);
          clearTimeout(step2Timer);
          if (err && err.name === 'AbortError') {
            dispatch({
              type: 'SET_ERROR',
              msg: 'Inference request timed out after 25 seconds. Please try a shorter audio clip.',
              kind: 'timeout',
            });
          } else {
            dispatch({
              type: 'SET_ERROR',
              msg: (err && err.message) || 'Backend API is unreachable. Ensure uvicorn is running on port 8080.',
              kind: (err && err.kind) || 'offline',
            });
          }
        } finally {
          clearTimeout(timeoutId);
        }
      };

      // 8. Download JSON Report
      const downloadJsonReport = () => {
        if (!state.result) return;
        const reportPayload = {
          forensic_engine: 'VOXFORENSICS // Wav2Vec2 + Deep MLP',
          evaluated_at: new Date().toISOString(),
          model_benchmark: {
            dataset: CONFIG.FACTS.dataset,
            dev_eer: CONFIG.FACTS.devEer,
            dev_accuracy: CONFIG.FACTS.devAccuracy,
          },
          analysis: state.result,
        };
        const blob = new Blob([JSON.stringify(reportPayload, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `forensic_report_${state.result.filename.replace(/[^a-z0-9]/gi, '_')}.json`;
        a.click();
      };

      const togglePlaybackRate = () => {
        const rates = [0.75, 1.0, 1.25];
        const next = rates[(rates.indexOf(playbackRate) + 1) % rates.length];
        setPlaybackRate(next);
        if (wavesurferRef.current) {
          wavesurferRef.current.setPlaybackRate(next);
        }
      };

      const formatTime = (sec) => {
        const m = Math.floor(sec / 60);
        const s = (sec % 60).toFixed(2).padStart(5, '0');
        return `${String(m).padStart(2, '0')}:${s}`;
      };

      // Dynamic ambient glow background based on state
      const ambientGlowStyle = useMemo(() => {
        if (state.status === 'analyzing') {
          return 'radial-gradient(circle at 50% 22%, rgba(251, 191, 36, 0.14) 0%, transparent 60%)';
        }
        if (state.status === 'result_bonafide') {
          return 'radial-gradient(circle at 50% 25%, rgba(52, 211, 153, 0.15) 0%, rgba(34, 211, 238, 0.06) 45%, transparent 70%)';
        }
        if (state.status === 'result_spoof') {
          return 'radial-gradient(circle at 50% 25%, rgba(255, 46, 136, 0.18) 0%, rgba(255, 77, 77, 0.08) 45%, transparent 70%)';
        }
        return 'radial-gradient(circle at 50% 18%, rgba(34, 211, 238, 0.11) 0%, rgba(255, 46, 136, 0.04) 55%, transparent 75%)';
      }, [state.status]);

      const spoofProb = state.result ? state.result.probabilities.spoof : 0;
      const bonaProb = state.result ? state.result.probabilities.bonafide : 0;
      const riskInfo = state.result ? getRiskClassification(state.result.prediction, spoofProb) : null;

      return (
        <>
          <div className="ambient-glow" style={{ background: ambientGlowStyle }} />

          {/* Accessibility Live Verdict Announcer */}
          <div className="sr-only" aria-live="polite" style={{ position: 'absolute', width: '1px', height: '1px', overflow: 'hidden', clip: 'rect(0,0,0,0)' }}>
            {state.result && (
              state.result.prediction === 'bonafide'
                ? `Human voice verified. Bona fide probability ${(bonaProb * 100).toFixed(1)} percent.`
                : `Synthetic voice detected. Spoof probability ${(spoofProb * 100).toFixed(1)} percent.`
            )}
          </div>

          {/* 1. STICKY TRANSLUCENT NAVBAR */}
          <header className="navbar">
            <div className="container nav-content">
              <a href="#" className="brand">
                <div className="brand-mark">
                  <Icon.Activity size={20} color="var(--cyan)" />
                </div>
                <div>
                  <div className="font-heading" style={{ fontWeight: 700, fontSize: '17px', letterSpacing: '-0.02em' }}>
                    VOX<span style={{ color: 'var(--cyan)' }}>FORENSICS</span>
                  </div>
                  <div className="mono" style={{ fontSize: '10px', color: 'var(--text-muted)', letterSpacing: '0.06em' }}>
                    WAV2VEC2 BIOMETRIC LAB
                  </div>
                </div>
              </a>

              <nav className="nav-links">
                <a href="#detector" className="nav-link">Live Detector</a>
                <a href="#pipeline" className="nav-link">Architecture</a>
                <a href="#benchmarks" className="nav-link">ASVspoof Metrics</a>
                <a href="/legacy" className="nav-link" style={{ fontSize: '12px', opacity: 0.75 }}>Legacy UI</a>
              </nav>

              <div className="health-pill mono" title="Polled from GET /health every 15s">
                <span className={`pulse-dot ${health.online && health.ready ? 'online' : 'offline'}`} />

                </div>

                <div className="glass-card" onMouseMove={handleCardMouseMove} style={{ padding: '24px' }}>
                  <div className="mono" style={{ fontSize: '11px', color: 'var(--text-muted)', textTransform: 'uppercase' }}>ASVSPOOF 2019 LA SPLITS</div>
                  <div className="mono" style={{ fontSize: '38px', fontWeight: 700, color: 'var(--magenta)', margin: '6px 0' }}>25,380</div>
                  <div style={{ fontSize: '13px', color: 'var(--text-muted)' }}>Training clips + <span className="mono" style={{ color: 'var(--text-primary)' }}>24,844</span> dev clips</div>
                </div>

                <div className="glass-card" onMouseMove={handleCardMouseMove} style={{ padding: '24px' }}>
                  <div className="mono" style={{ fontSize: '11px', color: 'var(--text-muted)', textTransform: 'uppercase' }}>TYPICAL INFERENCE LATENCY</div>
                  <div className="mono" style={{ fontSize: '28px', fontWeight: 700, color: 'var(--amber)', margin: '12px 0 8px' }}>Few hundred ms</div>
                  <div style={{ fontSize: '13px', color: 'var(--text-muted)' }}>Sub-second execution on standard CPU</div>
                </div>
              </div>

              {/* Detailed Architecture & Training Specs Grid */}
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(320px, 1fr))', gap: '20px' }}>
                <div className="glass-card" onMouseMove={handleCardMouseMove} style={{ padding: '26px' }}>
                  <h3 className="font-heading" style={{ fontSize: '18px', fontWeight: 700, marginBottom: '14px', color: 'var(--cyan)' }}>
                    Feature Extraction & Classifier Architecture
                  </h3>
                  <div style={{ display: 'grid', gap: '10px', fontSize: '13.5px' }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', borderBottom: '1px solid var(--glass-border)', paddingBottom: '8px' }}>
                      <span style={{ color: 'var(--text-muted)' }}>Backbone Model</span>
                      <span className="mono">facebook/wav2vec2-base</span>
                    </div>
                    <div style={{ display: 'flex', justifyContent: 'space-between', borderBottom: '1px solid var(--glass-border)', paddingBottom: '8px' }}>
                      <span style={{ color: 'var(--text-muted)' }}>Audio Normalization</span>
                      <span className="mono">Mono, 16 kHz resample</span>
                    </div>
                    <div style={{ display: 'flex', justifyContent: 'space-between', borderBottom: '1px solid var(--glass-border)', paddingBottom: '8px' }}>
                      <span style={{ color: 'var(--text-muted)' }}>Encoder Representation</span>
                      <span className="mono">12 blocks → 768-d mean-pooled</span>
                    </div>
                    <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                      <span style={{ color: 'var(--text-muted)' }}>MLP Head</span>
                      <span className="mono">768 → 256 (BN, ReLU, DO 0.3) → 64 (ReLU, DO 0.3) → 2</span>
                    </div>
                  </div>
                </div>

                <div className="glass-card" onMouseMove={handleCardMouseMove} style={{ padding: '26px' }}>
                  <h3 className="font-heading" style={{ fontSize: '18px', fontWeight: 700, marginBottom: '14px', color: 'var(--green)' }}>
                    Training Regime & Class-Imbalance Handling
                  </h3>
                  <div style={{ display: 'grid', gap: '10px', fontSize: '13.5px' }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', borderBottom: '1px solid var(--glass-border)', paddingBottom: '8px' }}>
                      <span style={{ color: 'var(--text-muted)' }}>Class Distribution</span>
                      <span className="mono">Spoof outnumbers bona fide ~9:1</span>
                    </div>
                    <div style={{ display: 'flex', justifyContent: 'space-between', borderBottom: '1px solid var(--glass-border)', paddingBottom: '8px' }}>
                      <span style={{ color: 'var(--text-muted)' }}>Loss Weighting</span>
                      <span className="mono">Balanced class weights</span>
                    </div>
                    <div style={{ display: 'flex', justifyContent: 'space-between', borderBottom: '1px solid var(--glass-border)', paddingBottom: '8px' }}>
                      <span style={{ color: 'var(--text-muted)' }}>Optimizer & Learning Rate</span>
                      <span className="mono">AdamW (lr = 1e-3)</span>
                    </div>
                    <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                      <span style={{ color: 'var(--text-muted)' }}>Batch Size</span>
                      <span className="mono">128</span>
                    </div>
                  </div>
                </div>
              </div>

              {/* Session Analysis History Chart */}
              <SessionHistoryChart
                history={state.history}
                onSelectRun={(item) => {
                  dispatch({ type: 'RELOAD_HISTORY_ITEM', item });
                  window.location.hash = '#detector';
                }}
              />

              {/* Honest Limitations & Responsible Use Card */}
              <div
                className="glass-card"
                onMouseMove={handleCardMouseMove}
                style={{
                  marginTop: '24px',
                  padding: '26px',
                  borderColor: 'rgba(251, 191, 36, 0.28)',
                  background: 'linear-gradient(135deg, rgba(251, 191, 36, 0.05), rgba(255, 255, 255, 0.02))',
                }}
              >
                <div style={{ display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '10px', color: 'var(--amber)' }}>
                  <Icon.AlertOctagon size={20} color="var(--amber)" />
                  <h3 className="font-heading" style={{ fontSize: '17px', fontWeight: 700 }}>
                    Limitations & Responsible Use
                  </h3>
                </div>
                <p style={{ fontSize: '14px', color: 'var(--text-muted)', lineHeight: 1.65 }}>
                  Reported metrics (1.41% EER, 99.22% accuracy) are measured on the <strong>ASVspoof 2019 Logical Access (LA) dev set</strong>. Real-world detection performance can drop on unseen next-generation voice generators, heavily noisy environments, lossy or telefonically compressed audio codecs, and very short clips. This tool is designed as an automated <strong>screening aid, not definitive proof</strong>.
                </p>
              </div>
            </div>
          </section>

          {/* 7. FOOTER */}
          <footer style={{ borderTop: '1px solid var(--glass-border)', padding: '44px 0', background: 'rgba(4, 5, 10, 0.8)' }}>
            <div className="container" style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '18px' }}>
              <div style={{ display: 'flex', flexWrap: 'wrap', justifyContent: 'center', gap: '10px' }}>
                {['React 18', 'FastAPI', 'PyTorch', 'facebook/wav2vec2-base', 'WaveSurfer.js', 'Web Audio API FFT', 'ASVspoof 2019 LA'].map((badge) => (
                  <span
                    key={badge}
                    className="mono"
                    style={{
                      padding: '5px 12px',
                      borderRadius: '999px',
                      fontSize: '11px',
                      background: 'var(--glass-bg)',
                      border: '1px solid var(--glass-border)',
                      color: 'var(--text-muted)',
                    }}
                  >
                    {badge}
                  </span>
                ))}
              </div>

              <div style={{ display: 'flex', alignItems: 'center', gap: '20px', fontSize: '14px', color: 'var(--text-muted)' }}>
                <span>Built by <strong style={{ color: 'var(--text-primary)' }}>Rahul</strong></span>
                <span>•</span>
                <a
                  href="https://github.com/Rahul-git64/Deepfake-voice-detection"
                  target="_blank"
                  rel="noreferrer"
                  style={{ color: 'var(--cyan)', textDecoration: 'none', display: 'inline-flex', alignItems: 'center', gap: '6px' }}
                >
                  <Icon.Github size={15} /> GitHub Repository
                </a>
                <span>•</span>
                <a href="/docs" style={{ color: 'var(--text-muted)', textDecoration: 'none' }}>OpenAPI Docs</a>
              </div>
            </div>
          </footer>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
